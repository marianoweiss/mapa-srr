<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Carga - Sociedad Rural de Rivadavia</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.css">
    
    <style>
        :root {
            --color-primario: #2E7D32;
            --color-secundario: #1B5E20;
            --color-fondo: #f4f7f6;
            --color-texto: #333;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--color-fondo); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .admin-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 600px; width: 100%; border-top: 5px solid var(--color-primario); }
        
        .header-logo { text-align: center; margin-bottom: 20px; }
        .header-logo img { max-height: 90px; width: auto; }
        
        h2 { margin-top: 0; color: var(--color-texto); border-bottom: 2px solid #eaeaea; padding-bottom: 10px; font-size: 20px; text-align: center; }
        
        .form-group { margin-bottom: 22px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #555; font-size: 14px; }
        input[type="text"], input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 14px; }
        input[type="text"]:focus { outline: none; border-color: var(--color-primario); }
        
        #mapa-selector { height: 350px; border-radius: 5px; border: 1px solid #ccc; margin-bottom: 10px; z-index: 1; }
        .coords-display { background: #e9ecef; padding: 10px; border-radius: 5px; font-family: monospace; font-size: 13px; color: var(--color-texto); text-align: center; }
        
        .category-group { display: flex; gap: 10px; }
        .btn-cat { flex: 1; padding: 12px; background-color: #f0f0f0; border: 2px solid #ddd; border-radius: 5px; font-size: 15px; font-weight: bold; color: #666; cursor: pointer; transition: all 0.2s; }
        .btn-cat:hover { background-color: #e4e4e4; }
        .btn-cat.active { background-color: var(--color-primario); border-color: var(--color-primario); color: white; }

        .btn-submit { width: 100%; padding: 15px; background-color: var(--color-primario); color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
        .btn-submit:hover { background-color: var(--color-secundario); }
        .btn-submit:disabled { background-color: #ccc; cursor: not-allowed; }
        
        #status-msg { margin-top: 15px; text-align: center; font-weight: bold; padding: 12px; border-radius: 5px; display: none; font-size: 14px; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <div class="admin-container">
        <div class="header-logo">
            <img src="logo.png" alt="Sociedad Rural de Rivadavia" onerror="this.style.display='none'">
        </div>
        
        <h2>Ingresar Nuevo Relevamiento</h2>
        
        <form id="form-relevamiento">
            <div class="form-group">
                <label>1. Selecciona la Ubicación en el Mapa</label>
                <div id="mapa-selector"></div>
                <div class="coords-display" id="coords-text">Haz clic en el mapa para fijar las coordenadas</div>
                <input type="hidden" id="latitud" required>
                <input type="hidden" id="longitud" required>
            </div>

            <div class="form-group">
                <label>2. Fecha de la Toma</label>
                <input type="text" id="fecha" placeholder="Selecciona una fecha en el calendario..." required>
            </div>

            <div class="form-group">
                <label>3. Categoría</label>
                <div class="category-group">
                    <button type="button" class="btn-cat active" data-val="Caminos">Caminos</button>
                    <button type="button" class="btn-cat" data-val="Agua">Aguas</button>
                </div>
                <input type="hidden" id="categoria" value="Caminos" required>
            </div>

            <div class="form-group">
                <label>4. Archivo (Foto o Video)</label>
                <input type="file" id="archivo" accept="image/*,video/mp4" required>
            </div>

            <button type="submit" class="btn-submit" id="btn-submit">Subir a la Base de Datos</button>
            <div id="status-msg"></div>
        </form>
    </div>

    <!-- Librerías Externas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/l10n/es.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Librería de compresión (puede ser bloqueada por archivos locales, el código lo contempla) -->
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
    
    <!-- Carga de límites del partido -->
    <script src="limites.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            
            // --- 1. CONFIGURACIÓN DE SUPABASE ---
            // IMPORTANTE: Asegúrate de que la URL termine en .co y NO en .co/
            const SUPABASE_URL = 'https://kebtmodjufzvujwksnfx.supabase.co'; 
            const SUPABASE_ANON_KEY = 'sb_publishable_Zb1k9GfDLj1zstrog98zug_RAwQluPM'; 
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            // --- 2. INICIALIZAR EL MINIMAPA ---
            const map = L.map('mapa-selector').setView([-35.5, -63.3], 9);
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18 }).addTo(map);
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18 }).addTo(map);
            
            if (typeof limitesPartido !== 'undefined') {
                L.geoJSON(limitesPartido, { style: { color: "#00FF00", weight: 3, fillOpacity: 0 } }).addTo(map);
            }
            
            setTimeout(() => { map.invalidateSize(); }, 300);
            
            let marcadorActual = null;
            map.on('click', function(e) {
                const lat = e.latlng.lat;
                const lng = e.latlng.lng;
                if (marcadorActual) map.removeLayer(marcadorActual);
                marcadorActual = L.marker([lat, lng]).addTo(map);
                document.getElementById('latitud').value = lat;
                document.getElementById('longitud').value = lng;
                document.getElementById('coords-text').innerText = `Lat: ${lat.toFixed(5)} | Lng: ${lng.toFixed(5)}`;
            });

            // --- 3. INICIALIZAR CALENDARIO ---
            flatpickr("#fecha", { locale: "es", dateFormat: "Y-m-d", disableMobile: true });

            // --- 4. LÓGICA DE CATEGORÍAS ---
            const botonesCat = document.querySelectorAll('.btn-cat');
            const inputCategoria = document.getElementById('categoria');
            botonesCat.forEach(boton => {
                boton.addEventListener('click', function() {
                    botonesCat.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    inputCategoria.value = this.getAttribute('data-val');
                });
            });

            // --- 5. LÓGICA DE SUBIDA (Con Plan B para compresor bloqueado) ---
            document.getElementById('form-relevamiento').addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const btn = document.getElementById('btn-submit');
                const status = document.getElementById('status-msg');
                const lat = document.getElementById('latitud').value;
                const lng = document.getElementById('longitud').value;
                const fecha = document.getElementById('fecha').value;
                const categoria = document.getElementById('categoria').value;
                let archivoRaw = document.getElementById('archivo').files[0];

                if (!lat || !lng) {
                    mostrarMensaje('Error: Debes hacer clic en el mapa para fijar la ubicación.', 'error');
                    return;
                }

                btn.disabled = true;
                btn.innerText = 'Procesando archivo...';
                status.style.display = 'none';

                try {
                    let archivoFinal = archivoRaw;
                    const esImagen = archivoRaw.type.startsWith('image/');
                    const tipoArchivo = esImagen ? 'foto' : 'video';

                    // PLAN B: Si es imagen, intentamos comprimir. Si falla o está bloqueado, usamos el archivo original.
                    if (esImagen) {
                        try {
                            if (typeof browserImageCompression !== 'undefined') {
                                const opcionesCompresion = { maxSizeMB: 1, maxWidthOrHeight: 1920, useWebWorker: false };
                                archivoFinal = await browserImageCompression(archivoRaw, opcionesCompresion);
                            } else {
                                console.warn("El compresor está bloqueado por el navegador. Subiendo imagen en tamaño original.");
                            }
                        } catch (compErr) {
                            console.warn("Error en la compresión, procediendo con archivo original.", compErr);
                            archivoFinal = archivoRaw;
                        }
                    }

                    btn.innerText = 'Subiendo a la nube...';
                    // Reemplazamos los espacios del nombre original para evitar problemas de formato (Rutas inválidas)
                    const nombreLimpio = archivoFinal.name.replace(/[^a-zA-Z0-9.]/g, "_");
                    const nombreArchivo = `${Date.now()}_${nombreLimpio}`;
                    
                    const { data: storageData, error: storageError } = await supabase.storage
                        .from('archivos_mapa')
                        .upload(nombreArchivo, archivoFinal);

                    if (storageError) {
                        console.error("Error en Storage:", storageError);
                        throw storageError;
                    }

                    const { data: urlData } = supabase.storage
                        .from('archivos_mapa')
                        .getPublicUrl(nombreArchivo);
                    
                    const urlPublica = urlData.publicUrl;

                    btn.innerText = 'Guardando registro...';
                    const { error: dbError } = await supabase
                        .from('relevamientos')
                        .insert([{
                            fecha: fecha,
                            latitud: parseFloat(lat),
                            longitud: parseFloat(lng),
                            categoria: categoria,
                            tipo_archivo: tipoArchivo,
                            url_archivo: urlPublica
                        }]);

                    if (dbError) {
                        console.error("Error en BD:", dbError);
                        throw dbError;
                    }

                    mostrarMensaje('¡Relevamiento guardado con éxito!', 'success');
                    document.getElementById('form-relevamiento').reset();
                    if (marcadorActual) map.removeLayer(marcadorActual);
                    document.getElementById('coords-text').innerText = 'Haz clic en el mapa para fijar las coordenadas';
                    botonesCat[0].click(); 

                } catch (error) {
                    console.error("Error crítico:", error);
                    mostrarMensaje('Ocurrió un error en la subida. Verifica que el Bucket "archivos_mapa" exista.', 'error');
                } finally {
                    btn.disabled = false;
                    btn.innerText = 'Subir a la Base de Datos';
                }
            });

            function mostrarMensaje(texto, tipo) {
                const status = document.getElementById('status-msg');
                status.innerText = texto;
                status.className = tipo;
                status.style.display = 'block';
            }
        });
    </script>
</body>
</html>
